[package]
name = "skerry-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
skerry-core = { path = "../skerry-core" }
anyhow = "1"
tracing = "0.1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net"] }
arboard = { version = "3", default-features = false, features = ["image-data"] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
x11rb = { version = "0.13", features = ["xtest", "xinput", "randr", "xkb", "xfixes"] }
ashpd = { version = "0.13", default-features = false, features = ["tokio", "input_capture", "remote_desktop", "screencast"] }
reis = { version = "0.7", features = ["tokio"] }
futures-util = "0.3"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25", features = ["highsierra"] }
core-foundation = "0.10"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { version = "0.13", features = ["xtest"] }
