[package]
name = "skerry-cli"
description = "Run Skerry without a window (servers, tiling setups, troubleshooting)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "skerry-cli"
path = "src/main.rs"

[dependencies]
skerry-core = { path = "../../crates/skerry-core" }
skerry-platform = { path = "../../crates/skerry-platform" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
