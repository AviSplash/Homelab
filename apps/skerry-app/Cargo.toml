[package]
name = "skerry-app"
description = "Skerry: share one mouse and keyboard between Windows, macOS and Linux computers"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "skerry"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
skerry-core = { path = "../../crates/skerry-core" }
skerry-platform = { path = "../../crates/skerry-platform" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = ["custom-protocol"]
# Serve the bundled UI instead of a dev server. Keep enabled for release builds.
custom-protocol = ["tauri/custom-protocol"]
